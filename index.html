<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Points Tracker</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f4f6;
  margin:0;
  padding:20px;
  color:#222
}
h1{text-align:center;margin:5px 0 8px}
.sub{text-align:center;color:#666;margin-bottom:20px}
.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin:16px 0;
  box-shadow:0 3px 15px #0001
}
.name{
  font-size:24px;
  font-weight:800;
  text-align:center
}
.score{
  text-align:center;
  font-size:58px;
  font-weight:900;
  margin:8px
}
.status{
  text-align:center;
  font-weight:700;
  margin-bottom:15px
}
.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px
}
button{
  border:0;
  border-radius:12px;
  padding:14px 5px;
  font-size:18px;
  font-weight:800;
  background:#e8e8ed
}
button.plus{background:#d9f7df}
.minus{background:#ffdcdc}
.reset{
  display:block;
  margin:18px auto;
  background:#222;
  color:white;
  padding:12px 22px
}
.log{
  font-size:13px;
  color:#666;
  margin-top:14px;
  min-height:18px
}
.sync{
  text-align:center;
  font-size:12px;
  color:#777;
  margin-top:10px
}
</style>
</head>

<body>

<h1>🎮 Kids Points Tracker</h1>

<div class="sub">
Start each day at 20 points • Yesterday's score determines today's gaming
</div>

<div id="cards"></div>

<button class="reset" onclick="resetAll()">
Reset both to 20
</button>

<div class="sync" id="syncStatus">
Connecting...
</div>

<script>

const kids=["Kaden","Zavier"];

const DATABASE_URL =
"https://kids-points-shared-default-rtdb.asia-southeast1.firebasedatabase.app";

let scores={
  Kaden:20,
  Zavier:20
};


/* GAMING STATUS */

function status(n){

  if(n>=20)
    return["🟢 3 hours gaming","Full gaming"];

  if(n>=18)
    return["🟢 2 hours gaming","2 hours gaming"];

  if(n>=15)
    return["🟡 1 hour gaming","1 hour gaming"];

  if(n>=10)
    return["🟠 No gaming","No gaming"];

  return["🔴 No gaming + PHONE LOST","No gaming and phone taken away"];
}


/* LOAD SCORES */

async function loadScores(){

  try{

    const response=await fetch(
      DATABASE_URL+"/scores.json"
    );

    if(!response.ok)
      throw new Error("Database error");

    const data=await response.json();

    if(data && typeof data==="object"){

      scores={
        Kaden:Math.min(20,Math.max(0,Number(data.Kaden ?? 20))),
        Zavier:Math.min(20,Math.max(0,Number(data.Zavier ?? 20)))
      };

    }else{

      await saveScores();

    }

    render();

    document.getElementById("syncStatus").textContent=
      "🟢 Synced";

  }catch(error){

    console.error(error);

    document.getElementById("syncStatus").textContent=
      "🔴 Connection problem";

  }
}


/* SAVE SCORES */

async function saveScores(){

  try{

    await fetch(
      DATABASE_URL+"/scores.json",
      {
        method:"PUT",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(scores)
      }
    );

    document.getElementById("syncStatus").textContent=
      "🟢 Synced";

  }catch(error){

    console.error(error);

    document.getElementById("syncStatus").textContent=
      "🔴 Couldn't save";

  }
}


/* CHANGE SCORE - MAXIMUM 20 */

async function change(k,n){

  scores[k]=Math.min(
    20,
    Math.max(
      0,
      Number(scores[k])+n
    )
  );

  render();

  document.getElementById("syncStatus").textContent=
    "Saving...";

  await saveScores();

}


/* RESET */

async function resetAll(){

  if(confirm("Reset both kids to 20 points?")){

    scores={
      Kaden:20,
      Zavier:20
    };

    render();

    document.getElementById("syncStatus").textContent=
      "Saving...";

    await saveScores();

  }

}


/* DISPLAY */

function render(){

  document.getElementById("cards").innerHTML=

    kids.map(k=>{

      let s=status(scores[k]);

      return `
      <div class="card">

        <div class="name">
          ${k}
        </div>

        <div class="score">
          ${scores[k]} ⭐
        </div>

        <div class="status">
          ${s[0]}<br>
          <small>${s[1]}</small>
        </div>

        <div class="buttons">

          <button class="plus"
            onclick="change('${k}',1)">
            +1
          </button>

          <button class="plus"
            onclick="change('${k}',2)">
            +2
          </button>

          <button class="plus"
            onclick="change('${k}',3)">
            +3
          </button>

          <button class="minus"
            onclick="change('${k}',-1)">
            −1
          </button>

          <button class="minus"
            onclick="change('${k}',-2)">
            −2
          </button>

          <button class="minus"
            onclick="change('${k}',-3)">
            −3
          </button>

          <button class="minus"
            onclick="change('${k}',-5)">
            −5
          </button>

          <button
            onclick="change('${k}',5)">
            +5
          </button>

        </div>

        <div class="log">
          Tap a button whenever they earn or lose points.
        </div>

      </div>
      `;

    }).join("");

}


/* SYNC EVERY 2 SECONDS */

async function syncFromFirebase(){

  try{

    const response=await fetch(
      DATABASE_URL+"/scores.json"
    );

    if(!response.ok)
      return;

    const data=await response.json();

    if(data && typeof data==="object"){

      const newScores={

        Kaden:Math.min(
          20,
          Math.max(0,Number(data.Kaden ?? 20))
        ),

        Zavier:Math.min(
          20,
          Math.max(0,Number(data.Zavier ?? 20))
        )

      };

      if(
        newScores.Kaden!==scores.Kaden ||
        newScores.Zavier!==scores.Zavier
      ){

        scores=newScores;

        render();

      }

    }

  }catch(error){

    console.log("Sync error:",error);

  }

}


/* START */

loadScores();

setInterval(
  syncFromFirebase,
  2000
);

</script>

</body>
</html>
